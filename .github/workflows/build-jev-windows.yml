name: Build Mouzi Jev for Windows
on:
  workflow_dispatch:
  push:
    branches: [jev-triage]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build unsigned desktop app and installer
        run: npm run tauri build -- --ci --bundles nsis --config src-tauri/tauri.jev.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: mouzi-jev-windows
          path: |
            src-tauri/target/release/mouzi.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
